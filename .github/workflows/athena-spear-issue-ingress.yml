name: Athena Direct Spear Issue ingress

on:
  issue_comment:
    types: [created]

concurrency:
  group: athena-spear-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  key-or-preview:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (startsWith(github.event.comment.body, 'ATLAS_SPEAR_KEY_REQUEST_V1') ||
       startsWith(github.event.comment.body, 'ATLAS_SPEAR_PREVIEW_V1'))
    runs-on: ubuntu-latest
    environment: atlas-spear-ingress
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      ATLAS_SPEAR_INGRESS_PRIVATE_KEY_V1: ${{ secrets.ATLAS_SPEAR_INGRESS_PRIVATE_KEY_V1 }}
      ATLAS_SPEAR_INGRESS_PUBLIC_KEY_V1: ${{ secrets.ATLAS_SPEAR_INGRESS_PUBLIC_KEY_V1 }}
      ATLAS_SPEAR_INGRESS_KEY_ID_V1: ${{ secrets.ATLAS_SPEAR_INGRESS_KEY_ID_V1 }}
    steps:
      - name: Check out exact default-branch source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned ingress dependencies
        run: python -m pip install --disable-pip-version-check -r tools/athena_routes/spear_issue_requirements.txt
      - name: Process key or read-only Preview request
        run: >-
          python -B -m tools.athena_routes.spear_issue_ingress
          --mode ${{ startsWith(github.event.comment.body, 'ATLAS_SPEAR_KEY_REQUEST_V1') && 'key' || 'preview' }}

  execute-or-resume:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (startsWith(github.event.comment.body, 'ATLAS_SPEAR_EXECUTE_V1') ||
       startsWith(github.event.comment.body, 'ATLAS_SPEAR_RESUME_V1'))
    runs-on: ubuntu-latest
    environment: atlas-spear-ingress
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      ATLAS_SPEAR_INGRESS_PRIVATE_KEY_V1: ${{ secrets.ATLAS_SPEAR_INGRESS_PRIVATE_KEY_V1 }}
      ATLAS_SPEAR_INGRESS_PUBLIC_KEY_V1: ${{ secrets.ATLAS_SPEAR_INGRESS_PUBLIC_KEY_V1 }}
      ATLAS_SPEAR_INGRESS_KEY_ID_V1: ${{ secrets.ATLAS_SPEAR_INGRESS_KEY_ID_V1 }}
    steps:
      - name: Check out exact default-branch source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned ingress dependencies
        run: python -m pip install --disable-pip-version-check -r tools/athena_routes/spear_issue_requirements.txt
      - name: Configure ephemeral GitHub credential helper
        run: gh auth setup-git
      - name: Configure ephemeral commit identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Execute or resume exact sealed Mission
        run: >-
          python -B -m tools.athena_routes.spear_issue_ingress
          --mode ${{ startsWith(github.event.comment.body, 'ATLAS_SPEAR_EXECUTE_V1') && 'execute' || 'resume' }}
